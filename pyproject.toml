[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "musubi-opencode"
version = "0.1.1"
description = "OpenCode adapter for identity-scoped Musubi continuity"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Eric Mey", email = "ericmey@gmail.com" }]
dependencies = ["musubi-harness>=1.8.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12", "mypy>=1.15"]

[project.scripts]
musubi-opencode-bridge = "musubi_opencode.bridge:main"
musubi-opencode-mcp = "musubi_opencode.mcp:main"

[project.urls]
Repository = "https://github.com/sourceblender/musubi-opencode"

[tool.hatch.build.targets.wheel]
packages = ["src/musubi_opencode"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
